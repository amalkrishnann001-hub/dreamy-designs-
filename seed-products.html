<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs Product Import</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;line-height:1.5}
button{padding:12px 18px;border:0;border-radius:8px;background:#222;color:#fff;font-weight:bold}
#status{white-space:pre-line;background:#f5f5f5;padding:15px;border-radius:8px;margin-top:20px}
</style>
</head>
<body>
<h1>Dreamy Designs Product Import</h1>
<p>This page imports the old built-in products into the same Firestore collection used by DD Admin.</p>
<p>Use this once. After the import, manage products from DD Admin.</p>
<button id="importBtn">Import Existing Products</button>
<div id="status">Waiting...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBdYWBLspsfNZ_T3C3sUPZLo3AzqitnO9Y",
  authDomain: "dreamy-designs-admin.firebaseapp.com",
  projectId: "dreamy-designs-admin",
  storageBucket: "dreamy-designs-admin.firebasestorage.app",
  messagingSenderId: "421647280739",
  appId: "1:421647280739:web:86d07f7c0b733b79cca656"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const repoBase = "https://raw.githubusercontent.com/amalkrishnann001-hub/dreamy-designs-/main/images/";

const oldProducts = [
{id:"a3",name:"A3 Frame",price:549,category:"frames",description:"A beautiful A3 customized frame for photos, memories, artwork and special occasions. Personalize it with your preferred photo or design.",imgs:["a3-1.jpg","a3-2.jpg","a3-3.jpg"]},
{id:"a4",name:"A4 Frame",price:419,category:"frames",description:"A stylish A4 customized frame suitable for birthdays, anniversaries, gifts and room decoration. Send your preferred photo/design for customization.",imgs:["a4-1.jpg","a4-2.jpg","a4-3.jpg"]},
{id:"a5",name:"A5 Frame",price:219,category:"frames",description:"Compact A5 customized photo frame, perfect for desks, shelves and personal gifts. Choose your photo and customization.",imgs:["a5-1.jpg","a5-2.jpg"]},
{id:"a6",name:"A6 Frame",price:169,category:"frames",description:"A small and affordable A6 customized frame for personal memories and simple gifting.",imgs:["a6-1.jpg","a6-2.jpg"]},
{id:"mini",name:"Mini Frame",price:129,category:"frames",description:"Cute mini customized frame designed for small memorable photos and thoughtful gifts.",imgs:["mini-1.jpg","mini-2.jpg"]},
{id:"micro",name:"Microframe",price:109,category:"frames",description:"A tiny customized frame that makes a simple and memorable gift. Great for small photos and desk decoration.",imgs:["micro-1.jpg","micro-2.jpg"]},
{id:"ring",name:"Ring Album",price:139,category:"gifts",description:"A customized ring album for collecting multiple memories in one creative gift. Suitable for birthdays and special occasions.",imgs:["ring-1.jpg","ring-2.jpg","ring-3.jpg"]},
{id:"mirror",name:"Magic Mirror",price:629,category:"gifts",description:"A creative customized magic mirror gift with a special visual presentation. A unique choice for memorable occasions.",imgs:["mirror-1.jpg","mirror-2.jpg"]},
{id:"polaroids",name:"Polaroids",price:5,category:"printing",description:"Customized Polaroid-style photo prints starting from ₹5 per piece. Send your selected photos and customization requirements.",imgs:["polaroid-1.jpg","polaroid-2.jpg"]},
{id:"nameslip",name:"Customized Name Slip",price:99,category:"gifts",description:"Customized name slips designed for gifts, decorations and personal use. Share the name and preferred design style.",imgs:["nameslip-1.jpg","nameslip-2.jpg"]},
{id:"certificate",name:"Certificate Making",price:50,category:"printing",description:"Customized certificate designing and making service. Price: ₹50 per certificate. For orders above 10 certificates, the rate is ₹39 per certificate.",imgs:["certificate-1.jpg","certificate-2.jpg"]},
{id:"special-a3",name:"Special 100+ Pics A3 Frame",price:669,category:"frames",description:"A special A3 frame designed to showcase 100+ pictures in one memorable collage. Ideal for birthdays, anniversaries and large memory collections.",imgs:["special-a3-1.jpg","special-a3-2.jpg","special-a3-3.jpg"]},
{id:"cards",name:"Welcome & Visiting Cards",price:0,category:"printing",description:"Customized welcome cards and visiting cards. Pricing depends on quantity, paper, design and finishing requirements. Contact us for a quotation.",imgs:["cards-1.jpg","cards-2.jpg"]},
{id:"earrings",name:"Earrings",price:0,category:"other",description:"Stylish earrings available at affordable rates. Designs and availability may vary. Contact Dreamy Designs for current collections.",imgs:["earrings-1.jpg","earrings-2.jpg"]},
{id:"onam-box",name:"Onam Special Gift Box",price:999,category:"gifts",description:"A special Onam gift box prepared for festive gifting. Customization and contents can be discussed before ordering.",imgs:["onam-1.jpg","onam-2.jpg","onam-3.jpg"]},
{id:"spiral",name:"Spiral Binding",price:89,category:"printing",description:"Spiral binding service for projects, records, assignments and documents. Send your pages and requirements for confirmation.",imgs:["spiral-1.jpg"]},
{id:"soft",name:"Soft Binding",price:80,category:"printing",description:"Affordable soft binding service for academic projects, assignments and documents.",imgs:["soft-1.jpg"]},
{id:"calendar",name:"Customized Calendar",price:150,category:"gifts",description:"Customized calendar featuring your selected photos and design. A useful and personal gift for family and friends.",imgs:["calendar-1.jpg","calendar-2.jpg"]},
{id:"momentum",name:"Momentum",price:300,category:"gifts",description:"Customized momentum/trophy-style gifting option suitable for recognition, appreciation and special occasions.",imgs:["momentum-1.jpg","momentum-2.jpg"]}
];

const topSelling = new Set(["a3","a4","special-a3","mirror","ring","onam-box","calendar"]);

function setStatus(text){ document.getElementById("status").textContent = text; }

auth.onAuthStateChanged(user => {
  if (!user) {
    setStatus("Please log in to DD Admin in the same browser first, then open this import page.");
  } else {
    setStatus("Admin login detected. Ready to import.");
  }
});

document.getElementById("importBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) {
    setStatus("No Admin login detected. Log in to DD Admin first, then return here.");
    return;
  }

  const button = document.getElementById("importBtn");
  button.disabled = true;
  let output = "";

  try {
    for (const p of oldProducts) {
      const gallery = p.imgs.slice(1).map(name => repoBase + name);
      const data = {
        name: p.name,
        price: p.price,
        category: p.category,
        description: p.description,
        orderLink: "",
        image: repoBase + p.imgs[0],
        gallery,
        trending: false,
        topSelling: topSelling.has(p.id),
        importedFromOldSite: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection("products").doc("legacy_" + p.id).set(data, {merge:true});
      output += "Imported: " + p.name + "\n";
      setStatus(output);
    }

    setStatus(output + "\nImport completed.\nNow open DD Admin and refresh the Products section.");
  } catch (error) {
    console.error(error);
    setStatus(output + "\nImport stopped:\n" + error.message);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
